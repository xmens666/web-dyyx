    <!-- API配置 -->
    <script src="api-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const restaurantId = getUrlParam('id');

            if (!restaurantId) {
                showError();
                return;
            }

            try {
                const restaurant = await getRestaurantById(restaurantId);

                if (!restaurant) {
                    showError();
                    return;
                }

                renderRestaurant(restaurant);

            } catch (err) {
                console.error('加载餐厅失败:', err);
                showError();
            }
        });

        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        function renderRestaurant(restaurant) {
            // 更新页面标题
            document.title = `${restaurant.name} - 江湖食肆`;

            // 封面图
            const coverImage = restaurant.images && restaurant.images.length > 0
                ? restaurant.images[0]
                : DEFAULT_PRODUCT_IMAGE;
            document.getElementById('restaurantCover').src = coverImage;

            // 基本信息
            document.getElementById('restaurantName').textContent = restaurant.name;
            document.getElementById('cuisineTag').textContent = getCuisineName(restaurant.cuisine);

            // 认证徽章
            if (restaurant.business_verified) {
                document.getElementById('verifiedBadge').classList.remove('hidden');
            }

            // 营业状态
            const businessStatus = getBusinessStatus(restaurant);
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = businessStatus.text;
            statusBadge.className = `px-3 py-1 rounded-full text-sm ${businessStatus.class}`;

            // 评分
            const rating = restaurant.rating || 0;
            document.getElementById('starRating').innerHTML = renderStars(rating);
            document.getElementById('ratingScore').textContent = rating.toFixed(1);
            document.getElementById('reviewCount').textContent = `(${restaurant.review_count || 0}条点评)`;
            document.getElementById('viewCount').innerHTML = `<i class="fas fa-eye mr-1"></i>${restaurant.view_count || 0}`;

            // 价格和营业时间
            document.getElementById('priceRange').innerHTML = `<i class="fas fa-yen-sign mr-1"></i>${getPriceRange(restaurant.price_range)}`;
            document.getElementById('businessHours').innerHTML = `<i class="fas fa-clock mr-1"></i>${restaurant.business_hours || '详情请咨询'}`;

            // 定休日
            if (restaurant.closed_days) {
                const closedDaysHeader = document.getElementById('closedDaysHeader');
                closedDaysHeader.classList.remove('hidden');
                closedDaysHeader.innerHTML = `<i class="fas fa-calendar-times mr-1"></i>定休: ${restaurant.closed_days}`;
            }

            // 服务方式
            const serviceTypes = document.getElementById('serviceTypes');
            let serviceHtml = '';
            if (restaurant.dine_in_enabled) {
                serviceHtml += '<span class="bg-white/20 px-3 py-1 rounded-full text-sm"><i class="fas fa-store mr-1"></i>堂食</span>';
            }
            if (restaurant.takeout_enabled) {
                serviceHtml += '<span class="bg-white/20 px-3 py-1 rounded-full text-sm"><i class="fas fa-shopping-bag mr-1"></i>外带</span>';
            }
            if (restaurant.self_delivery_enabled) {
                serviceHtml += '<span class="bg-white/20 px-3 py-1 rounded-full text-sm"><i class="fas fa-motorcycle mr-1"></i>外卖</span>';
            }
            if (restaurant.dine_in_reservation) {
                serviceHtml += '<span class="bg-white/20 px-3 py-1 rounded-full text-sm"><i class="fas fa-calendar-check mr-1"></i>可预约</span>';
            }
            serviceTypes.innerHTML = serviceHtml;

            // 认证信息
            renderCertifications(restaurant);

            // 简介
            document.getElementById('restaurantDescription').textContent = restaurant.description || '暂无简介';

            // 创店年份
            if (restaurant.established_year) {
                const establishedEl = document.getElementById('establishedYear');
                establishedEl.classList.remove('hidden');
                establishedEl.innerHTML = `<i class="fas fa-history mr-1"></i>创立于 ${restaurant.established_year} 年`;
            }

            // 位置信息
            if (restaurant.region) {
                const regionEl = document.getElementById('restaurantRegion');
                regionEl.classList.remove('hidden');
                regionEl.innerHTML = `<i class="fas fa-globe-asia text-gray-400 mr-2"></i>地区: ${restaurant.region}`;
            }
            if (restaurant.city) {
                const cityEl = document.getElementById('restaurantCity');
                cityEl.classList.remove('hidden');
                cityEl.innerHTML = `<i class="fas fa-city text-gray-400 mr-2"></i>城市: ${restaurant.city}`;
            }
            if (restaurant.district) {
                const districtEl = document.getElementById('restaurantDistrict');
                districtEl.classList.remove('hidden');
                districtEl.innerHTML = `<i class="fas fa-map text-gray-400 mr-2"></i>区域: ${restaurant.district}`;
            }
            document.getElementById('restaurantAddress').textContent = restaurant.address || '地址未公开';
            if (restaurant.location) {
                const locationEl = document.getElementById('restaurantLocation');
                locationEl.classList.remove('hidden');
                locationEl.textContent = restaurant.location;
            }

            // 地图链接
            if (restaurant.address) {
                document.getElementById('mapLink').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(restaurant.address)}`;
                document.getElementById('navigateButton').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(restaurant.address)}`;
            }

            // 联系方式已隐藏，引导用户下载APP

            // 设施服务
            renderFacilities(restaurant);

            // 座位信息
            renderSeatingInfo(restaurant);

            // 特色菜品 - 兼容字符串和对象格式
            if (restaurant.specialties && restaurant.specialties.length > 0) {
                document.getElementById('menuSection').classList.remove('hidden');
                document.getElementById('menuList').innerHTML = restaurant.specialties.map(item => {
                    // 兼容旧格式（字符串）和新格式（对象 {name, image_url}）
                    const name = typeof item === 'string' ? item : (item.name || '');
                    const imageUrl = typeof item === 'object' && item.image_url ? item.image_url : null;

                    if (imageUrl) {
                        return `
                            <div class="menu-card bg-orange-50 rounded-lg overflow-hidden border border-orange-100">
                                <img src="${imageUrl}" alt="${name}" class="w-full aspect-square object-cover" onerror="this.style.display='none'">
                                <p class="font-medium text-gray-800 p-3 text-center">${name}</p>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="menu-card bg-orange-50 rounded-lg p-4 text-center border border-orange-100">
                                <i class="fas fa-utensils text-orange-400 mb-2"></i>
                                <p class="font-medium text-gray-800">${name}</p>
                            </div>
                        `;
                    }
                }).join('');
            }

            // 环境照片
            if (restaurant.images && restaurant.images.length > 1) {
                document.getElementById('photosSection').classList.remove('hidden');
                document.getElementById('photoGallery').innerHTML = restaurant.images.slice(1).map(img => `
                    <img src="${img}" alt="餐厅环境"
                         class="rounded-lg aspect-square object-cover cursor-pointer hover:opacity-90 transition"
                         onclick="window.open('${img}', '_blank')"
                         onerror="this.style.display='none'">
                `).join('');
            }

            // 外卖配送
            if (restaurant.self_delivery_enabled) {
                document.getElementById('deliverySection').classList.remove('hidden');
                let deliveryHtml = '';
                if (restaurant.self_delivery_fee !== null && restaurant.self_delivery_fee !== undefined) {
                    deliveryHtml += `<p class="flex justify-between"><span class="text-gray-600">配送费:</span><span class="font-medium">${formatPrice(restaurant.self_delivery_fee)}</span></p>`;
                }
                if (restaurant.self_delivery_min_order) {
                    deliveryHtml += `<p class="flex justify-between"><span class="text-gray-600">起送金额:</span><span class="font-medium">${formatPrice(restaurant.self_delivery_min_order)}</span></p>`;
                }
                if (restaurant.self_delivery_range) {
                    deliveryHtml += `<p class="flex justify-between"><span class="text-gray-600">配送范围:</span><span class="font-medium">${restaurant.self_delivery_range}</span></p>`;
                }
                document.getElementById('deliveryInfo').innerHTML = deliveryHtml || '<p class="text-gray-500">详情请咨询餐厅</p>';
            }

            // 支付方式
            if (restaurant.payment_methods && restaurant.payment_methods.length > 0) {
                document.getElementById('paymentSection').classList.remove('hidden');
                const paymentMap = {
                    'cash': { icon: 'fa-money-bill-wave', label: '现金', color: 'green' },
                    'credit_card': { icon: 'fa-credit-card', label: '信用卡', color: 'blue' },
                    'paypay': { icon: 'fa-mobile-alt', label: 'PayPay', color: 'red' },
                    'line_pay': { icon: 'fab fa-line', label: 'LINE Pay', color: 'green' },
                    'suica': { icon: 'fa-train', label: 'Suica', color: 'green' },
                    'wechat_pay': { icon: 'fab fa-weixin', label: '微信支付', color: 'green' },
                    'alipay': { icon: 'fab fa-alipay', label: '支付宝', color: 'blue' },
                    'id': { icon: 'fa-id-card', label: 'iD', color: 'red' },
                    'quicpay': { icon: 'fa-bolt', label: 'QUICPay', color: 'purple' }
                };
                document.getElementById('paymentMethods').innerHTML = restaurant.payment_methods.map(method => {
                    const info = paymentMap[method] || { icon: 'fa-wallet', label: method, color: 'gray' };
                    return `<span class="inline-flex items-center bg-${info.color}-50 text-${info.color}-700 px-3 py-1 rounded-full text-sm">
                        <i class="fas ${info.icon} mr-1"></i>${info.label}
                    </span>`;
                }).join('');
            }

            // 店主信息
            if (restaurant.users) {
                document.getElementById('ownerSection').classList.remove('hidden');
                document.getElementById('ownerAvatar').src = restaurant.users.avatar_url || DEFAULT_AVATAR;
                document.getElementById('ownerName').textContent = restaurant.users.nickname || '店主';
            }

            // 营业信息
            const businessInfo = document.getElementById('businessInfo');
            let infoHtml = '';
            if (restaurant.business_hours) infoHtml += `<li>• 营业时间: ${restaurant.business_hours}</li>`;
            if (restaurant.closed_days) infoHtml += `<li>• 定休日: ${restaurant.closed_days}</li>`;
            if (restaurant.seating_capacity) infoHtml += `<li>• 座位数: ${restaurant.seating_capacity}席</li>`;
            if (restaurant.table_count) infoHtml += `<li>• 餐桌数: ${restaurant.table_count}桌</li>`;
            if (restaurant.max_party_size) infoHtml += `<li>• 最大接待: ${restaurant.max_party_size}人</li>`;
            if (restaurant.max_reservation_days) infoHtml += `<li>• 最多可提前${restaurant.max_reservation_days}天预约</li>`;
            if (restaurant.parking_available && restaurant.parking_spaces) {
                infoHtml += `<li>• 停车位: ${restaurant.parking_spaces}个</li>`;
            }
            businessInfo.innerHTML = infoHtml || '<li>• 详情请咨询餐厅</li>';

            // 显示内容
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            document.getElementById('bottomBar').classList.remove('hidden');
        }

        function renderCertifications(restaurant) {
            const certifications = [];
            if (restaurant.business_verified) {
                certifications.push({ icon: 'fa-store', label: '商家认证', verified: true });
            }
            if (restaurant.business_license_verified) {
                certifications.push({ icon: 'fa-file-alt', label: '营业执照', verified: true });
            }
            if (restaurant.food_hygiene_verified) {
                certifications.push({ icon: 'fa-utensils', label: '食品卫生', verified: true });
            }
            if (restaurant.fire_safety_verified) {
                certifications.push({ icon: 'fa-fire-extinguisher', label: '消防安全', verified: true });
            }

            if (certifications.length > 0) {
                document.getElementById('certificationSection').classList.remove('hidden');
                document.getElementById('certificationList').innerHTML = certifications.map(cert => `
                    <div class="flex items-center gap-2 bg-white rounded-lg p-3 border border-green-200">
                        <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center">
                            <i class="fas ${cert.icon} text-green-600 text-sm"></i>
                        </div>
                        <span class="text-sm font-medium text-green-700">${cert.label}</span>

                    </div>

        function renderFacilities(restaurant) {
            const facilities = [];

            // WiFi
            if (restaurant.has_wifi || restaurant.wifi_available) {
                facilities.push({ icon: 'fa-wifi', label: 'WiFi', color: 'blue' });
            }
            // 停车场
            if (restaurant.parking_available) {
                facilities.push({ icon: 'fa-parking', label: '停车场', color: 'blue' });
            }
            // 包间
            if (restaurant.private_rooms) {
                const label = restaurant.private_rooms_count ? `包间(${restaurant.private_rooms_count}间)` : '包间';
                facilities.push({ icon: 'fa-door-closed', label: label, color: 'purple' });
            }
            // 儿童友好
            if (restaurant.child_friendly) {
                facilities.push({ icon: 'fa-baby', label: '儿童友好', color: 'pink' });
            }
            // 儿童座椅
            if (restaurant.has_child_seats) {
                facilities.push({ icon: 'fa-baby-carriage', label: '儿童座椅', color: 'pink' });
            }
            // 无障碍
            if (restaurant.wheelchair_accessible) {
                facilities.push({ icon: 'fa-wheelchair', label: '无障碍', color: 'green' });
            }
            // TV
            if (restaurant.has_tv) {
                facilities.push({ icon: 'fa-tv', label: '电视', color: 'gray' });
            }
            // 吸烟
            if (restaurant.is_non_smoking) {
                facilities.push({ icon: 'fa-smoking-ban', label: '禁烟', color: 'red' });
            } else if (restaurant.has_smoking_room) {
                facilities.push({ icon: 'fa-smoking', label: '吸烟室', color: 'gray' });
            } else if (restaurant.has_smoking_seats) {
                facilities.push({ icon: 'fa-smoking', label: '吸烟席', color: 'gray' });
            } else if (restaurant.smoking_allowed) {
                facilities.push({ icon: 'fa-smoking', label: '可吸烟', color: 'gray' });
            }

            if (facilities.length > 0) {
                document.getElementById('facilitiesSection').classList.remove('hidden');
                document.getElementById('facilitiesList').innerHTML = facilities.map(f => `
                    <span class="facility-tag inline-flex items-center bg-${f.color}-50 text-${f.color}-700 px-4 py-2 rounded-full text-sm">
                        <i class="fas ${f.icon} mr-2"></i>${f.label}
                    </span>
                `).join('');
            } else {
                document.getElementById('facilitiesSection').classList.add('hidden');
            }
        }

        function renderSeatingInfo(restaurant) {
            const seatingInfo = [];
            if (restaurant.seating_capacity) {
                seatingInfo.push({ icon: 'fa-users', label: '总座位', value: `${restaurant.seating_capacity}席` });
            }
            if (restaurant.table_count) {
                seatingInfo.push({ icon: 'fa-th-large', label: '餐桌数', value: `${restaurant.table_count}桌` });
            }
            if (restaurant.max_party_size) {
                seatingInfo.push({ icon: 'fa-user-friends', label: '最大接待', value: `${restaurant.max_party_size}人` });
            }
            if (restaurant.private_rooms && restaurant.private_rooms_count) {
                seatingInfo.push({ icon: 'fa-door-closed', label: '包间数', value: `${restaurant.private_rooms_count}间` });
            }

            if (seatingInfo.length > 0) {
                document.getElementById('seatingSection').classList.remove('hidden');
                document.getElementById('seatingInfo').innerHTML = seatingInfo.map(info => `
                    <div class="bg-amber-50 rounded-lg p-4 text-center">
                        <i class="fas ${info.icon} text-amber-500 text-xl mb-2"></i>
                        <p class="text-gray-500 text-xs">${info.label}</p>
                        <p class="font-bold text-gray-800">${info.value}</p>
                    </div>
                `).join('');
            }
        }

        function getBusinessStatus(restaurant) {
            const now = new Date();
            const currentDay = now.getDay();
            const currentTime = now.getHours() * 100 + now.getMinutes();

            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
            const dayNamesCN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const dayNamesJP = ['日曜', '月曜', '火曜', '水曜', '木曜', '金曜', '土曜'];

            const closedDays = restaurant.closed_days || '';
            const isHoliday = (
                closedDays.includes(dayNames[currentDay]) ||
                closedDays.includes(dayNamesCN[currentDay]) ||
                closedDays.includes(dayNamesJP[currentDay])
            );

            if (isHoliday) {
                return { status: 'holiday', text: '定休日', class: 'status-holiday' };
            }

            const businessHours = restaurant.business_hours || '';
            if (!businessHours) {
                return { status: 'unknown', text: '营业中', class: 'status-open' };
            }

            const timeMatch = businessHours.match(/(\d{1,2}):?(\d{2})?\s*[-~～]\s*(\d{1,2}):?(\d{2})?/);
            if (timeMatch) {
                const openHour = parseInt(timeMatch[1]) * 100 + (parseInt(timeMatch[2]) || 0);
                const closeHour = parseInt(timeMatch[3]) * 100 + (parseInt(timeMatch[4]) || 0);

                if (currentTime >= openHour && currentTime < closeHour) {
                    return { status: 'open', text: '营业中', class: 'status-open' };
                } else {
                    return { status: 'closed', text: '休息中', class: 'status-closed' };
                }
            }

            return { status: 'open', text: '营业中', class: 'status-open' };
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);

            let html = '';
            for (let i = 0; i < fullStars; i++) {
                html += '<i class="fas fa-star star"></i>';
            }
            if (halfStar) {
                html += '<i class="fas fa-star-half-alt star"></i>';
            }
            for (let i = 0; i < emptyStars; i++) {
                html += '<i class="far fa-star star-empty"></i>';
            }
            return html;
        }

        function getCuisineName(cuisine) {
            const cuisines = {
                'chinese': '中华料理',
                'japanese': '日本料理',
                'korean': '韩国料理',
                'western': '西餐',
                'italian': '意大利菜',
                'french': '法国菜',
                'thai': '泰国菜',
                'vietnamese': '越南菜',
                'indian': '印度菜',
                'cafe': '咖啡厅',
                'bar': '酒吧',
                'ramen': '拉面',
                'sushi': '寿司',
                'yakiniku': '烤肉',
                'izakaya': '居酒屋',

        function getPriceRange(range) {

                'expensive': '¥3,000~5,000',
                'luxury': '¥5,000以上'
            };
            return ranges[range] || range || '价格面议';
        }
