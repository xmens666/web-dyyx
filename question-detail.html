    <!-- 底部固定栏 -->

    <!-- API配置 -->
    <script src="api-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const questionId = getUrlParam('id');

            if (!questionId) {
                showError();
                return;
            }

            try {
                const question = await getQuestionById(questionId);

                if (!question) {
                    showError();
                    return;
                }

                renderQuestion(question);

                // 加载回答
                const answers = await getQuestionAnswers(questionId);
                renderAnswers(answers);

            } catch (err) {
                console.error('加载问题失败:', err);
                showError();
            }
        });

        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        function renderQuestion(question) {
            // 更新页面标题
            document.title = `${question.title} - 江湖问答`;

            // 问题标题
            document.getElementById('questionTitle').textContent = question.title;

            // 标签
            const tagsContainer = document.getElementById('questionTags');
            const category = question.category || 'other';
            tagsContainer.innerHTML = `<span class="tag bg-white/20">${getCategoryName(category)}</span>`;
            if (question.tags && question.tags.length > 0) {
                tagsContainer.innerHTML += question.tags.map(tag =>
                    `<span class="tag bg-white/20">${tag}</span>`
                ).join('');
            }

            // 统计数据
            document.getElementById('answerCount').innerHTML = `<i class="fas fa-comments mr-1"></i>${question.answer_count || 0} 回答`;
            document.getElementById('viewCount').innerHTML = `<i class="fas fa-eye mr-1"></i>${question.view_count || 0} 浏览`;
            document.getElementById('postTime').innerHTML = `<i class="fas fa-clock mr-1"></i>${formatDate(question.created_at)}`;

            // 提问者信息
            if (question.users) {
                const user = question.users;
                document.getElementById('askerAvatar').src = user.avatar_url || DEFAULT_AVATAR;
                document.getElementById('askerName').textContent = user.nickname || '匿名用户';
                document.getElementById('askerInfo').textContent = `提问于 ${formatDate(question.created_at)}`;
            }

            // 问题内容
            document.getElementById('questionContent').textContent = question.content || question.description || '暂无详细描述';

            // 问题图片
            if (question.images && question.images.length > 0) {
                const imagesContainer = document.getElementById('questionImages');
                imagesContainer.classList.remove('hidden');
                imagesContainer.innerHTML = question.images.map(img => `
                    <img src="${img}" alt="问题图片"
                         class="rounded-lg aspect-square object-cover cursor-pointer hover:opacity-90 transition"
                         onclick="window.open('${img}', '_blank')">
                `).join('');
            }

            // 悬赏信息
            if (question.reward && question.reward > 0) {
                document.getElementById('rewardSection').classList.remove('hidden');
                document.getElementById('rewardAmount').textContent = `${question.reward} 游侠币`;
            }

            // 显示内容
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            document.getElementById('bottomBar').classList.remove('hidden');
        }

        function renderAnswers(answers) {
            const answerList = document.getElementById('answerList');
            document.getElementById('totalAnswers').textContent = `(${answers.length})`;

            if (!answers || answers.length === 0) {
                document.getElementById('noAnswers').classList.remove('hidden');
                return;
            }

            answerList.innerHTML = answers.map((answer, index) => {
                const isBest = answer.is_accepted || answer.is_best;
                return `
                    <div class="answer-card ${isBest ? 'best-answer' : ''} bg-white rounded-xl p-5 shadow-sm">
                        ${isBest ? `
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-yellow-500 text-white text-xs px-2 py-1 rounded-full">
                                    <i class="fas fa-crown mr-1"></i>最佳回答
                                </span>
                            </div>
                        ` : ''}
                        <div class="flex items-start gap-3">
                            <img src="${answer.users?.avatar_url || DEFAULT_AVATAR}" alt="回答者头像"
                                 class="w-10 h-10 rounded-full object-cover border-2 border-gray-100 flex-shrink-0">
                            <div class="flex-1">
                                <div class="flex items-center justify-between mb-2">
                                    <p class="font-medium text-gray-800">${answer.users?.nickname || '匿名用户'}</p>
                                    <p class="text-gray-400 text-xs">${formatDate(answer.created_at)}</p>
                                </div>
                                <p class="text-gray-700 whitespace-pre-wrap mb-3">${answer.content}</p>
                                <div class="flex items-center gap-4 text-sm text-gray-500">
                                    <span><i class="fas fa-thumbs-up mr-1"></i>${answer.like_count || 0}</span>
                                    <span><i class="fas fa-comment mr-1"></i>${answer.comment_count || 0}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getCategoryName(category) {
            const categories = {
                'life': '生活',
                'work': '工作',
                'study': '学习',
                'visa': '签证',
                'housing': '租房',
                'medical': '医疗',
                'shopping': '购物',
                'travel': '旅游',
                'legal': '法律',
                'tax': '税务',
                'other': '其他'
            };
            return categories[category] || category || '问答';
        }
    </script>
